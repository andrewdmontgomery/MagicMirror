services:
  magicmirror:
    container_name: magicmirror
    image: karsten13/magicmirror:latest
    restart: unless-stopped
    environment:
      - MM_SCENARIO=server
    # Local secrets (CARTO key etc.). Copy .env.example to .env and fill in
    # values — .env is gitignored and never committed.
    env_file:
      - .env
    volumes:
      - ./mounts/config:/opt/magic_mirror/config
      - ./mounts/modules/MMM-WindCompass:/opt/magic_mirror/modules/MMM-WindCompass
      - ./mounts/modules/MMM-WeatherWatcher:/opt/magic_mirror/modules/MMM-WeatherWatcher
      - ./mounts/modules/MMM-HourlyStrip:/opt/magic_mirror/modules/MMM-HourlyStrip
      - ./mounts/modules/MMM-WeatherMap:/opt/magic_mirror/modules/MMM-WeatherMap
    ports:
      - "8080:8080"
