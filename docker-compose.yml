services:
  magicmirror:
    container_name: magicmirror
    image: karsten13/magicmirror:latest
    restart: unless-stopped
    environment:
      - MM_SCENARIO=server
    volumes:
      - ./mounts/config:/opt/magic_mirror/config
      - ./mounts/modules/MMM-WindCompass:/opt/magic_mirror/modules/MMM-WindCompass
      - ./mounts/modules/MMM-RAIN-MAP:/opt/magic_mirror/modules/MMM-RAIN-MAP
      - ./mounts/modules/MMM-RainWatcher:/opt/magic_mirror/modules/MMM-RainWatcher
      - ./mounts/modules/MMM-HourlyStrip:/opt/magic_mirror/modules/MMM-HourlyStrip
    ports:
      - "8080:8080"
